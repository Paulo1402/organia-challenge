#    restart: always
#    depends_on:
#      - backend
#    env_file:
#      - .env
#    volumes:
#      - ./frontend:/app
#    working_dir: /app
#    ports:
#      - "3000:3000"
#    networks:
#        - db-backend

networks:
  db-backend:
    driver: bridge

volumes:
    postgres-data: